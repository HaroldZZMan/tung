<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loading</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #fc2651;
        color: #fff;
        font-family: Arial, sans-serif;
      }

      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fc2651;
      }

      #content {
        width: min(420px, 82vw);
        text-align: center;
      }

      .spinner {
        position: relative;
        width: 17.6px;
        height: 17.6px;
        margin: 0 auto 44px;
        animation: spin 1.4s infinite linear;
      }

      .spinner div {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 2px;
        background: #fff;
        animation: pulse 1.75s infinite ease;
        filter: drop-shadow(0 0 1px rgba(168, 85, 247, 0.32));
      }

      .spinner div:nth-child(1) { --rotation: 90; }
      .spinner div:nth-child(2) { --rotation: 180; }
      .spinner div:nth-child(3) { --rotation: 270; }
      .spinner div:nth-child(4) { --rotation: 360; }

      .label {
        margin-bottom: 10px;
        color: #d8b4fe;
        font-size: 14px;
      }

      .bar {
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: #171717;
      }

      .progress {
        width: 0;
        height: 100%;
        border-radius: 999px;
        background: #a855f7;
        box-shadow: 0 0 3px rgba(168, 85, 247, 0.25);
        transition: width 0.12s linear;
      }

      .percentage {
        margin-top: 9px;
        color: #a855f7;
        font-size: 12px;
      }

      @keyframes pulse {
        0%, 100% { transform: rotate(calc(var(--rotation) * 1deg)) translateY(0); }
        50% { transform: rotate(calc(var(--rotation) * 1deg)) translateY(300%); }
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <main id="loading" aria-live="polite">
      <div id="content">
        <div class="spinner" aria-hidden="true">
          <div></div><div></div><div></div><div></div>
        </div>
        <div class="label" id="label">Loading...</div>
        <div
          class="bar"
          role="progressbar"
          aria-label="Page loading"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div class="progress" id="progress"></div>
        </div>
        <div class="percentage" id="percentage">0%</div>
      </div>
    </main>
    <script>
      const progress = document.getElementById("progress");
      const percentage = document.getElementById("percentage");
      const label = document.getElementById("label");
      const bar = document.querySelector('[role="progressbar"]');

      let value = 0;
      const timer = setInterval(() => {
        value = Math.min(value + Math.random() * 8 + 2, 100);
        const rounded = Math.floor(value);
        progress.style.width = `${rounded}%`;
        percentage.textContent = `${rounded}%`;
        bar.setAttribute("aria-valuenow", String(rounded));

        if (rounded >= 100) {
          clearInterval(timer);
          label.textContent = "Ready";
        }
      }, 160);
    </script>
  </body>
</html>
